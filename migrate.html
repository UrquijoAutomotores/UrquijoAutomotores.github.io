        async function restoreData() {
            const msgEl = document.getElementById('msg');
            
            // Verificar si hay sesión
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) {
                msgEl.className = 'error';
                msgEl.innerText = 'Error: No has iniciado sesión. Abre "admin.html" en otra pestaña, inicia sesión con la cuenta de tu papá, y luego vuelve a cargar esta página.';
                return;
            }

            try {
                // Borrar IDs porque Supabase los genera solos
                const dataToInsert = oldData.map(car => {
                    const { id, ...carWithoutId } = car;
                    return carWithoutId;
                });

                const { data, error } = await window.supabaseClient
                    .from('cars')
                    .insert(dataToInsert);

                if (error) throw error;
                
                msgEl.className = 'success';
                msgEl.innerText = '¡Restauración Completa! Todos los 8 autos antiguos ya están en tu base de datos de Supabase.';
                
            } catch (err) {
                msgEl.className = 'error';
                msgEl.innerText = 'Hubo un error: ' + err.message;
            }
        }

        restoreData();
