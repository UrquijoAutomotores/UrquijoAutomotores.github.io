<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Urquijo Automotores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">
    
    <!-- Navbar simple -->
    <nav class="bg-white shadow-md p-4 mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-900"><i class="fas fa-car-side mr-2"></i>Urquijo Automotores - Admin</h1>
            <a href="index.html" class="text-gray-500 hover:text-blue-600"><i class="fas fa-external-link-alt mr-1"></i>Ver página</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-6">
        <!-- Formulario de Login -->
        <div id="login-section" class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-6 text-center">Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Correo electrónico" class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 mb-6 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="login-btn" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition-colors">Entrar al panel</button>
        </div>

        <!-- Formulario de Carga de Autos (Oculto al inicio) -->
        <div id="admin-section" class="hidden bg-white p-8 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-6 pb-4 border-b">
                <h2 class="text-2xl font-bold">Cargar Nuevo Vehículo</h2>
                <button id="logout-btn" class="text-red-500 hover:text-red-700 font-semibold"><i class="fas fa-sign-out-alt mr-1"></i>Cerrar Sesión</button>
            </div>
            
            <form id="car-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Marca *</label>
                    <input type="text" id="brand" placeholder="Ej. Ford" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Modelo *</label>
                    <input type="text" id="model" placeholder="Ej. Fiesta Kinetic" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Versión</label>
                    <input type="text" id="trim" placeholder="Ej. Titanium" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Precio *</label>
                    <input type="text" id="price" placeholder="Ej. Consultar o $12.000" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Año *</label>
                    <input type="number" id="year" placeholder="Ej. 2015" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Kilómetros *</label>
                    <input type="text" id="km" placeholder="Ej. 111.000KM" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Combustible *</label>
                    <select id="fuel" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="Nafta">Nafta</option>
                        <option value="Diésel">Diésel</option>
                        <option value="GNC">GNC</option>
                        <option value="Híbrido">Híbrido</option>
                        <option value="Eléctrico">Eléctrico</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Condición *</label>
                    <select id="condition" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="Usados">Usado</option>
                        <option value="Nuevos">Nuevo (0KM)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Estado en página</label>
                    <select id="status" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Disponible">Disponible</option>
                        <option value="Reservado">Reservado</option>
                        <option value="Vendido">Vendido</option>
                        <option value="Destacado">Destacado</option>
                    </select>
                </div>
                <div class="flex items-center mt-6">
                    <input type="checkbox" id="available" checked class="w-5 h-5 mr-2 cursor-pointer"> 
                    <label for="available" class="font-semibold cursor-pointer">Mostrar a color (Disponible)</label>
                </div>

                <div class="col-span-full">
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Descripción</label>
                    <textarea id="description" placeholder="Agrega una descripción bonita para el vehículo..." class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none" rows="3"></textarea>
                </div>
                
                <div class="col-span-full">
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Características (Separadas por coma)</label>
                    <input type="text" id="features" placeholder="Ej: Aire acondicionado, Dirección asistida, 7 Airbags" class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="col-span-full p-4 bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg">
                    <label class="block font-bold mb-2 text-gray-700"><i class="fas fa-camera mr-2"></i>Fotos del Vehículo</label>
                    <input type="file" id="images" multiple accept="image/*" class="w-full p-2" required>
                    <p class="text-sm text-gray-500 mt-1">Selecciona todas las fotos que quieras subir a la vez.</p>
                </div>

                <button type="submit" id="submit-btn" class="col-span-full bg-green-600 text-white p-4 rounded-lg font-bold text-lg hover:bg-green-700 transition-colors mt-4 shadow-lg flex justify-center items-center">
                    <i class="fas fa-save mr-2"></i>Guardar Automóvil
                </button>
            </form>
            <div id="status-msg" class="mt-6 text-center font-bold text-lg hidden p-4 rounded"></div>

            <!-- Listado de inventario actual -->
            <div class="mt-12 pt-8 border-t border-gray-200">
                <h2 class="text-2xl font-bold mb-6">Inventario Actual</h2>
                <div id="cars-table-container" class="overflow-x-auto">
                    <!-- Tabla cargada dinámicamente -->
                    <p class="text-gray-500 text-center"><i class="fas fa-spinner fa-spin mr-2"></i>Cargando autos...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Supabase y Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="admin.js"></script>
</body>
</html>
